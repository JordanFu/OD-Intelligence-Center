<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OD 情报中心 · 知识库阅读</title>
  <meta name="description" content="OD 情报中心知识库独立阅读页">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #171a24;
      --surface2: #202434;
      --border: #31374b;
      --text: #eef2fb;
      --text2: #b2bad0;
      --accent: #7c92ff;
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, rgba(124,146,255,.08), transparent 340px), var(--bg);
      color: var(--text);
      line-height: 1.78;
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 23, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .brand strong { font-size: 14px; }
    .brand span { font-size: 12px; color: var(--text2); }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { opacity: .9; color: #fff; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 34px 20px 80px;
    }
    .hero {
      margin-bottom: 22px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(23, 26, 36, .72);
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--green), var(--orange));
    }
    .type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(124, 146, 255, .13);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.18;
      margin-bottom: 12px;
      letter-spacing: 0;
    }
    .description {
      color: var(--text2);
      font-size: 15px;
      max-width: 820px;
      margin-bottom: 16px;
    }
    .meta, .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .meta {
      color: var(--text2);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 12px;
      font-weight: 650;
    }
    .doc {
      background: rgba(23, 26, 36, .94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 18px 60px rgba(0,0,0,.18);
      overflow: hidden;
    }
    .doc h1 { font-size: 30px; margin: 4px 0 18px; }
    .doc h2 {
      font-size: 22px;
      margin: 36px 0 14px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .doc h3 { font-size: 17px; margin: 26px 0 10px; color: var(--green); }
    .doc h4 { font-size: 15px; margin: 20px 0 8px; color: var(--orange); }
    .doc p { color: var(--text2); margin: 10px 0; font-size: 14px; }
    .doc ul, .doc ol { display: grid; gap: 8px; margin: 12px 0 18px; padding-left: 22px; }
    .doc li { color: var(--text2); font-size: 14px; }
    .doc strong { color: var(--text); }
    .doc a { color: var(--green); text-decoration: none; font-weight: 700; }
    .doc a:hover { text-decoration: underline; }
    .doc blockquote {
      margin: 16px 0;
      padding: 14px 18px;
      border-left: 4px solid var(--green);
      background: rgba(52, 211, 153, .08);
      border-radius: 10px;
    }
    .doc blockquote p { color: var(--text); margin: 4px 0; }
    .doc hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
    .doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 22px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      font-size: 13px;
    }
    .doc th, .doc td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      color: var(--text2);
      vertical-align: top;
      text-align: left;
    }
    .doc th {
      background: var(--surface2);
      color: var(--text);
      font-weight: 800;
    }
    .doc code {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .92em;
    }
    .loading, .error {
      padding: 42px 20px;
      text-align: center;
      color: var(--text2);
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(23, 26, 36, .72);
    }
    .error strong { color: var(--red); }
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(90px);
      background: var(--green);
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      transition: transform .25s;
      z-index: 60;
      opacity: 0;
      visibility: hidden;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }
    @media (max-width: 720px) {
      .topbar-inner { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      main { padding: 20px 12px 54px; }
      .hero, .doc { padding: 18px; border-radius: 14px; }
      .doc table { display: block; overflow-x: auto; white-space: nowrap; }
    }
    @media print {
      .topbar, .toast { display: none; }
      body { background: #fff; color: #000; }
      main { max-width: none; padding: 0; }
      .hero, .doc { border: 0; box-shadow: none; background: #fff; color: #000; }
      .doc p, .doc li, .doc td, .description, .meta { color: #222; }
    }
  </style>
<link rel="stylesheet" href="assets/report-share.css">
<script defer src="assets/report-share.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <strong>OD 情报中心 · 知识库</strong>
        <span>可分享阅读页</span>
      </div>
      <div class="actions" id="actions">
        <a class="btn" href="./index.html">返回知识库</a>
      </div>
    </div>
  </header>
  <main>
    <section class="hero" id="hero" style="display:none"></section>
    <article class="doc" id="content"><div class="loading">正在加载知识库内容...</div></article>
  </main>
  <div class="toast" id="toast">已复制</div>

  <script>
    const SOURCE_TYPES = {
      consulting: { label: '咨询公司', icon: '📊' },
      academic: { label: '学术机构', icon: '🎓' },
      industry: { label: '行业研究', icon: '🏭' },
      internal: { label: '内部沉淀', icon: '🏢' },
      media: { label: '媒体深度', icon: '📰' },
      method: { label: '方法论', icon: '🧭' },
      local: { label: '本地资料', icon: '🗂️' }
    };
    const TOPIC_ICONS = {
      'AI组织设计': '🤖', '人才发展': '👥', '绩效管理': '📈', '变革管理': '🔄',
      '组织文化': '🏛️', '战略规划': '🎯', '数字化转型': '💻', '领导力': '👑',
      '职级改革': '🧭', '知识管理': '🧠', '技能组织': '🧩', '薪酬激励': '💰',
      '晋升机制': '🪜', '内部流动': '🔁', 'Agent': '🕹️', 'MCP': '🔌'
    };

    function esc(value) {
      return String(value || '').replace(/[&<>"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[char]);
    }
    function inline(value) {
      let text = esc(value);
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return text;
    }
    function stripFrontmatter(markdown) {
      return markdown.replace(/^---\n[\s\S]*?\n---\n+/, '');
    }
    function markdownToHtml(markdown) {
      const lines = stripFrontmatter(markdown).split(/\r?\n/);
      let html = '';
      let inUl = false;
      let inOl = false;
      let inQuote = false;
      let inTable = false;
      let tableRow = 0;

      const closeLists = () => {
        if (inUl) { html += '</ul>'; inUl = false; }
        if (inOl) { html += '</ol>'; inOl = false; }
      };
      const closeQuote = () => {
        if (inQuote) { html += '</blockquote>'; inQuote = false; }
      };
      const closeTable = () => {
        if (inTable) { html += '</tbody></table>'; inTable = false; tableRow = 0; }
      };

      for (const line of lines) {
        if (/^\s*$/.test(line)) {
          closeLists(); closeQuote(); closeTable();
          continue;
        }
        if (line.trim() === '---') {
          closeLists(); closeQuote(); closeTable();
          html += '<hr>';
          continue;
        }
        if (/^\|/.test(line.trim())) {
          closeLists(); closeQuote();
          const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
          if (cells.every(cell => /^:?-{3,}:?$/.test(cell))) continue;
          if (!inTable) {
            html += '<table><tbody>';
            inTable = true;
            tableRow = 0;
          }
          const tag = tableRow === 0 ? 'th' : 'td';
          html += `<tr>${cells.map(cell => `<${tag}>${inline(cell)}</${tag}>`).join('')}</tr>`;
          tableRow++;
          continue;
        }
        closeTable();
        let match = line.match(/^(#{1,4})\s+(.+)$/);
        if (match) {
          closeLists(); closeQuote();
          const level = match[1].length;
          html += `<h${level}>${inline(match[2])}</h${level}>`;
          continue;
        }
        match = line.match(/^>\s?(.*)$/);
        if (match) {
          closeLists();
          if (!inQuote) { html += '<blockquote>'; inQuote = true; }
          html += `<p>${inline(match[1])}</p>`;
          continue;
        }
        closeQuote();
        match = line.match(/^[-*]\s+(.+)$/);
        if (match) {
          if (!inUl) { closeLists(); html += '<ul>'; inUl = true; }
          html += `<li>${inline(match[1])}</li>`;
          continue;
        }
        match = line.match(/^\d+[.)]\s+(.+)$/);
        if (match) {
          if (!inOl) { closeLists(); html += '<ol>'; inOl = true; }
          html += `<li>${inline(match[1])}</li>`;
          continue;
        }
        closeLists();
        html += `<p>${inline(line)}</p>`;
      }
      closeLists(); closeQuote(); closeTable();
      return html;
    }
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast(message || '已复制');
    }
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function renderHero(report) {
      const type = SOURCE_TYPES[report.sourceType] || SOURCE_TYPES.industry;
      const meta = [report.author, report.publisher, report.date].filter(Boolean).map(esc).join(' · ');
      const topics = (report.topics || []).map(t => `<span class="pill">${TOPIC_ICONS[t] || '📌'} ${esc(t)}</span>`).join('');
      document.title = `${report.title} · OD 情报中心`;
      const hero = document.getElementById('hero');
      hero.style.display = '';
      hero.innerHTML = `
        <div class="type">${type.icon} ${esc(type.label)}</div>
        <h1>${esc(report.title)}</h1>
        <div class="description">${esc(report.description || '')}</div>
        <div class="meta">${meta || 'OD 情报中心知识库'}</div>
        <div class="topics">${topics}</div>
      `;
      const actions = document.getElementById('actions');
      actions.innerHTML = `
        <a class="btn" href="./index.html?kb=${encodeURIComponent(report.id)}">回到知识库</a>
        <button class="btn primary" onclick="copyText(location.href, '分享链接已复制')">复制链接</button>
        ${report.summaryFile ? `<a class="btn" href="${esc(report.summaryFile)}" target="_blank">Markdown</a>` : ''}
        ${report.originalUrl ? `<a class="btn" href="${esc(report.originalUrl)}" target="_blank">原始来源</a>` : ''}
      `;
    }
    async function init() {
      const id = getParam('id');
      const content = document.getElementById('content');
      if (!id) {
        content.innerHTML = '<div class="error"><strong>缺少内容 ID。</strong><br>请从知识库卡片打开分享页。</div>';
        return;
      }
      try {
        const catalogResp = await fetch('./knowledge/catalog.json');
        const catalog = await catalogResp.json();
        const report = (catalog.reports || []).find(item => item.id === id);
        if (!report) {
          content.innerHTML = '<div class="error"><strong>没有找到这篇知识卡。</strong><br>它可能已被重命名或尚未同步到目录。</div>';
          return;
        }
        renderHero(report);
        if (!report.summaryFile) {
          content.innerHTML = `<p>${esc(report.description || '暂无正文内容。')}</p>`;
          return;
        }
        const mdResp = await fetch(report.summaryFile);
        if (!mdResp.ok) throw new Error('markdown fetch failed');
        const markdown = await mdResp.text();
        content.innerHTML = markdownToHtml(markdown);
      } catch (error) {
        content.innerHTML = '<div class="error"><strong>加载失败。</strong><br>请稍后刷新，或返回知识库重新打开。</div>';
      }
    }
    init();
  </script>
</body>
</html>
