<!DOCTYPE html>
<html lang="zh-CN" data-edition="internal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OD 情报中心 · AI 组织设计研究</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242837;
      --surface3: #2a2f40;
      --border: #2e3348;
      --text: #e1e4ed;
      --text2: #8b91a8;
      --accent: #6c8cff;
      --accent2: #a78bfa;
      --green: #34d399;
      --green-dim: rgba(52, 211, 153, 0.12);
      --orange: #fbbf24;
      --red: #f87171;
      --trust-high: #fbbf24;
      --trust-mid: #60a5fa;
      --trust-ref: #a78bfa;

    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #242837 100%);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }
    .header-stats {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text2);
    }
    .header-stats strong { color: var(--accent); font-weight: 600; }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }
    .edition-share-button {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid rgba(108, 140, 255, 0.45);
      border-radius: 9px;
      background: rgba(108, 140, 255, 0.12);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
    }
    .edition-share-button:hover {
      background: rgba(108, 140, 255, 0.2);
      border-color: var(--accent);
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: var(--surface);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    
    .tab-btn.kb-tab.active {
      background: var(--orange);
      color: #000;
    }
    .tab-btn.levels-tab.active {
      background: var(--green);
      color: #000;
    }
    
    
    
    .tab-btn .badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      font-weight: 600;
    }
    .tab-btn.active .badge {
      background: rgba(255,255,255,0.25);
    }

    /* Page visibility */
    .page { display: none; }
    .page.active { display: block; }

    /* =================== Information Page =================== */
    .controls {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 24px;
    }
    .sync-bridge {
      margin-bottom: 14px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid rgba(102, 125, 234, 0.32);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }
    .sync-bridge-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sync-bridge strong {
      display: block;
      color: var(--text);
      font-size: 15px;
    }
    .sync-bridge p {
      margin-top: 4px;
      color: var(--text2);
      font-size: 13px;
    }
    .sync-bridge-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sync-bridge a {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 760;
      background: var(--green);
      color: #06140f;
    }
    .sync-bridge a.secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-dashboard {
      margin-bottom: 14px;
    }
    .public-status-panel {
      display: grid;
      gap: 12px;
    }
    .public-status-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .public-status-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--text3);
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.04em;
    }
    .public-status-title {
      margin: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.5;
      font-weight: 820;
    }
    .public-status-note {
      margin-top: 6px;
      color: var(--text2);
      font-size: 13px;
      line-height: 1.6;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      color: var(--text2);
      font-size: 12px;
      font-weight: 760;
    }
    .public-status-panel.pass .status-pill { background: rgba(52, 211, 153, 0.16); color: var(--green); }
    .public-status-panel.warn .status-pill { background: rgba(245, 158, 11, 0.16); color: var(--orange); }
    .public-status-panel.fail .status-pill { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
    .system-health-details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .system-health-details summary {
      width: fit-content;
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 7px 11px;
      border-radius: 9px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 780;
      cursor: pointer;
      list-style: none;
    }
    .system-health-details summary::-webkit-details-marker {
      display: none;
    }
    .system-health-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .system-health-item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(32, 36, 52, 0.72);
      border: 1px solid var(--border);
      color: var(--text2);
      font-size: 13px;
      line-height: 1.5;
    }
    .system-health-item strong {
      display: block;
      color: var(--text);
      font-size: 12px;
      margin-bottom: 2px;
    }
    .status-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .status-actions a,
    .status-actions .disabled-action {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 6px 9px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 740;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .status-actions .disabled-action {
      color: var(--text3);
      cursor: not-allowed;
      opacity: 0.76;
    }
    .manifest-fallback-warning {
      padding: 10px 12px;
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 10px;
      color: var(--orange);
      background: rgba(245, 158, 11, 0.08);
      font-size: 13px;
      font-weight: 720;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text2);
    }
    .filter-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label {
      font-size: 13px;
      color: var(--text2);
      margin-right: 4px;
      flex-shrink: 0;
    }
    .filter-tag {
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-tag:hover { border-color: var(--accent); color: var(--text); }
    .filter-tag.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .filter-tag.trust-high.active { background: var(--trust-high); border-color: var(--trust-high); color: #000; }
    .filter-tag.trust-mid.active { background: var(--trust-mid); border-color: var(--trust-mid); color: #fff; }
    .filter-tag.trust-ref.active { background: var(--trust-ref); border-color: var(--trust-ref); color: #fff; }
    .filter-tag.source-tag.active { background: var(--green); border-color: var(--green); color: #000; }
    @media (max-width: 860px) {
      .status-dashboard { grid-template-columns: 1fr; }
    }
    .filter-tag.collapsed { display: none; }
    .filter-tag.expanded { display: inline-block; }
    .filter-more {
      padding: 5px 12px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--text2);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-more:hover { border-color: var(--accent); color: var(--accent); }
    .stats {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text2);
    }
    .stats strong { color: var(--accent); }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    /* Day Group */
    .day-group { margin-top: 32px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-header h2 { font-size: 17px; font-weight: 600; color: var(--text); }
    .day-count {
      font-size: 12px;
      background: var(--surface2);
      padding: 2px 10px;
      border-radius: 12px;
      color: var(--text2);
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 16px rgba(108, 140, 255, 0.08);
      transform: translateY(-1px);
    }
    .card.active {
      border-color: var(--green);
      box-shadow: 0 4px 24px rgba(52, 211, 153, 0.1);
    }
    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title-area { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }
    .card-brief {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .card-trust-mini {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }
    .trust-high { background: rgba(251, 191, 36, 0.15); color: var(--trust-high); }
    .trust-mid { background: rgba(96, 165, 250, 0.15); color: var(--trust-mid); }
    .trust-ref { background: rgba(167, 139, 250, 0.15); color: var(--trust-ref); }
    .card-expand-icon {
      width: 20px;
      height: 20px;
      color: var(--text2);
      transition: transform 0.25s;
      flex-shrink: 0;
    }
    .card.active .card-expand-icon {
      transform: rotate(180deg);
      color: var(--green);
    }
    .card-meta-mini {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 6px;
      font-size: 12px;
      color: var(--text2);
    }

    /* Reader Panel */
    .reader-panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
      margin-top: 0;
    }
    .reader-panel.open {
      max-height: 1200px;
      opacity: 1;
      margin-top: 4px;
    }
    .reader-inner { padding: 24px; }
    .reader-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .reader-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      opacity: 0.3;
      line-height: 1;
      flex-shrink: 0;
    }
    .reader-title { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .reader-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .reader-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text2);
    }
    .reader-meta-item strong { color: var(--text); font-weight: 500; }
    .reader-section { margin-bottom: 16px; }
    .reader-section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text2);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .reader-section-label .icon { width: 16px; height: 16px; }
    .reader-summary { font-size: 15px; line-height: 1.8; }
    .reader-insight {
      font-size: 15px;
      color: var(--green);
      background: var(--green-dim);
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 4px solid var(--green);
      line-height: 1.8;
    }
    .reader-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .reader-tag {
      font-size: 12px;
      padding: 4px 10px;
      background: var(--surface);
      border-radius: 6px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .reader-tag:hover { background: var(--border); color: var(--text); }
    .reader-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .btn-read-original {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      text-decoration: none;
    }
    .btn-read-original:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-close-panel {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-close-panel:hover { border-color: var(--text2); color: var(--text); }
    
    

    /* Source coverage bar */
    .coverage {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .coverage-title { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
    .coverage-bar { display: flex; flex-wrap: wrap; gap: 6px; }
    .coverage-item {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--surface2);
      border-radius: 12px;
      color: var(--text2);
    }
    .coverage-item.active {
      background: rgba(52, 211, 153, 0.15);
      color: var(--green);
    }
    .coverage-count { color: var(--text); font-weight: 600; }

    /* =================== Daily Report Page =================== */
    .report-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 60px;
    }
    .report-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .report-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .report-stat-value {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .report-stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }

    /* =================== Master Report Banner =================== */
    .master-report-banner {
      background: linear-gradient(135deg, #1a1d27 0%, #232840 100%);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .master-report-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--green));
    }
    .master-report-banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(108, 140, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(108, 140, 255, 0.3);
      margin-bottom: 10px;
    }
    .master-report-banner h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .master-report-banner .subtitle {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 14px;
    }
    .master-report-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .master-report-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
    }
    .master-report-stat strong { color: var(--text); font-weight: 600; }
    .sub-props-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .sub-prop-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .sub-prop-chip-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .sub-prop-chip-finding { font-size: 11px; color: var(--text2); line-height: 1.4; }
    .sub-prop-chip.high { border-left: 3px solid var(--red); }
    .sub-prop-chip.medium { border-left: 3px solid var(--orange); }
    .master-report-insights { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .master-report-insight {
      font-size: 13px;
      color: var(--text);
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }
    .master-report-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .master-report-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: all 0.2s;

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--green);
      color: #000;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      transition: transform 0.3s ease;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      visibility: visible;
    }

    /* Footer */

    .kb-reader-overlay {

    }
    .kb-reader-overlay.open { display: flex; align-items: flex-end; justify-content: center; }
    .kb-reader-panel {

    .kb-reader-header {

    .kb-reader-type.academic { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .kb-reader-type.industry { background: rgba(52,211,153,0.15); color: #34d399; }
    .kb-reader-type.internal { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .kb-reader-type.media { background: rgba(248,113,113,0.15); color: #f87171; }

    .kb-reader-summary h1 { font-size: 18px; font-weight: 700; margin: 0 0 16px; color: var(--text); }
    .kb-reader-summary h2 { font-size: 15px; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
    .kb-reader-summary h3 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
    .kb-reader-summary p { margin: 0 0 12px; }
    .kb-reader-summary ul, .kb-reader-summary ol { margin: 0 0 12px; padding-left: 20px; }
    .kb-reader-summary li { margin-bottom: 6px; }

    .kb-archive-banner {

    /* ============================================================
       OD 情报中心 — 可读性优化补丁 v1
       原则：YAGNI / DRY —— 仅 override，不改写原规则，便于回滚。
       ============================================================ */

    /* ---------- 1. 文字对比度：text2 提亮 + 三档分级 ---------- */
    :root {
      --text2: #a3a9bf;     /* 由 #8b91a8 提亮，对比度 ~7.2:1 */
      --text3: #8b91a8;     /* 装饰性最次要文字（icon/dot） */
    }

    /* 原本 12-13px 用 --text2 的正文升级为 --text + 透明度，避免"灰糊糊" */
    .card-brief,
    .kb-card-desc,
    .pick-reason,
    .focus-text,
    .xhs-image-desc {
      color: var(--text);
      opacity: 0.82;
    }

    /* ---------- 2. 字号收敛：去掉中间档，建立 5 档层级 ---------- */
    .header h1        { font-size: 22px; letter-spacing: -0.01em; }
    .header p         { font-size: 13px; }
    .tab-btn          { font-size: 13px; padding: 11px 14px; min-height: 44px; }
    .card-title       { font-size: 17px; line-height: 1.45; }
    .card-brief       { font-size: 14px; }
    .card-meta-mini   { font-size: 13px; }
    .day-header h2    { font-size: 18px; }
    .day-count        { font-size: 13px; }
    .reader-title     { font-size: 19px; }
    .reader-summary   { font-size: 15px; }
    .reader-insight   { font-size: 15px; }
    .reader-meta      { font-size: 13px; }
    .report-day-title { font-size: 17px; }
    .report-day-meta  { font-size: 13px; }
    .spotlight-title  { font-size: 17px; }
    .spotlight-finding-item { font-size: 14px; }
    .master-report-banner h2 { font-size: 18px; }
    .kb-card-title    { font-size: 17px; }
    .kb-card-desc     { font-size: 14px; }
    .report-stat-label { font-size: 13px; }

    /* 11px 装饰性标签统一加字距 */
    .card-trust-mini, .badge, .report-day-badge,
    .kb-card-type, .xhs-note-type, .coverage-item,
    .kb-card-tag, .reader-tag, .report-tag,
    .kb-reader-topic-tag, .spotlight-badge,
    .master-report-banner-badge, .reader-section-label {
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    /* ---------- 3. 标题去渐变（提升对比度） ---------- */
    .header h1 {
      background: none;
      -webkit-text-fill-color: var(--text);
      color: var(--text);
    }
    .report-stat-value {
      background: none;
      -webkit-text-fill-color: var(--accent);
      color: var(--accent);
      font-size: 30px;

      background: rgba(108, 140, 255, 0.08);
      border-left-color: var(--accent);

    .controls,
    .content,
    .report-page,

  <script>
    // ============================================================
    // State
    // ============================================================
    let allDays = [];
    let kbReports = [];
    let kbSources = [];
    let currentTab = 'info';
    let activeTagFilter = null;
    let activeSourceFilter = null;

    const FILTER_LIMIT = 10; // 默认显示数量（2行）

    let statusManifests = { info: null, topics: null, knowledge: null, automation: null };
    let statusManifestLoadFailed = false;
    let statusManifestErrors = [];
    const ODIC_EDITION = window.ODICApp?.edition || 'internal';

    const PLATFORM_CATEGORIES = {
      '国内媒体': ['36氪', '机器之心', '钛媒体', '虎嗅', '界面新闻', '第一财经', '晚点LatePost', '新智元', '量子位', '新浪财经', '搜狐', '每日经济新闻'],
      '国际媒体': ['Hacker News', 'TechCrunch', 'The Verge', 'Wired', 'MIT Technology Review', 'Bloomberg', 'Reuters', 'WinBuzzer', 'siuleeboss'],
      '咨询公司': ['McKinsey', 'BCG', 'Bain', 'Mercer', 'Aon', 'Deloitte', '德勤', 'PwC', 'EY', 'Capgemini', 'WTW', 'Gartner'],
      '学术机构': ['HBR', 'HBS', 'Harvard', 'Stanford HAI', 'MIT CSAIL', 'MIT', 'arXiv', 'SSRN'],
      '行业研究': ['HRTech', 'InfoQ', '火山引擎', 'CCF'],
      '社交平台': ['小红书', '微信公众号', '知乎', '即刻', 'LinkedIn', 'Twitter/X', 'Reddit', '百度百家']
    };

    const KB_SOURCE_TYPES = {
      consulting: { label: '咨询公司', icon: '📊', class: 'consulting' },
      academic:   { label: '学术机构', icon: '🎓', class: 'academic' },
      industry:   { label: '行业研究', icon: '🏭', class: 'industry' },
      internal:   { label: '内部文档', icon: '🏢', class: 'internal' },
      media:      { label: '媒体深度', icon: '📰', class: 'media' }
    };

    const KB_TOPIC_TAGS = {
      'AI组织设计': '🤖',
      '人才发展':   '👥',
      '绩效管理':   '📈',
      '变革管理':   '🔄',
      '组织文化':   '🏛️',
      '战略规划':   '🎯',
      '数字化转型': '💻',
      '领导力':     '👑',
      '职级改革':   '🧭',
      '知识管理':   '🧠',
      '技能组织':   '🧩'
    };

    const TRUST_LEVELS = {
      '⭐高': { label: '⭐ 官方/学术/权威', class: 'trust-high', key: 'high' },
      '📰较高': { label: '📰 知名媒体', class: 'trust-mid', key: 'mid' },
      '💬参考': { label: '💬 社交/社区', class: 'trust-ref', key: 'ref' }
    };

    // ============================================================
    // Utility
    // ============================================================
    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function truncate(str, len) {
      if (!str) return '';
      return str.length > len ? str.substring(0, len) + '...' : str;
    }
    function highlightText(text, query) {
      if (!query || !text) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
    function getKBShareUrl(reportId) {
      return new URL(`./knowledge-viewer.html?id=${encodeURIComponent(reportId)}`, window.location.href).href;
    }
    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast(successMessage || '已复制');
    }
    function copyKBShareLink(reportId, event) {
      if (event) event.stopPropagation();
      copyText(getKBShareUrl(reportId), '分享链接已复制');
    }
    function copyHrShareLink() {
      copyText(window.ODICApp.getHrShareUrl(), 'HR 分享版链接已复制');
    }

    function statusClass(status) {
      if (status === 'pass' || status === 'formal') return 'pass';
      if (status === 'fail' || status === 'missing') return 'fail';
      return 'warn';
    }
    function statusText(status) {
      const map = {
        pass: '可信',
        warn: '待验证',
        fail: '失败',
        formal: '正式决策稿',
        scheduled: '待今日正式运行',
        fallback: '今日专题待正式更新',
        'needs-rerun': '今日专题待正式更新',
        missing: '缺失',
        'pending-link-check': '待验证'
      };
      return map[status] || status || '未知';
    }
    function overallPublicStatus(...statuses) {
      if (statuses.some(status => statusClass(status) === 'fail')) return 'fail';
      if (statuses.some(status => statusClass(status) === 'warn')) return 'warn';
      return 'pass';
    }
    function publicTopicStatus(topics) {
      if (topics?.todayStatus === 'formal') return `今日专题已正式更新`;
      if (topics?.todayStatus === 'scheduled') return `今日专题等待正式运行`;
      if (topics?.todayStatus === 'fallback' || topics?.todayStatus === 'needs-rerun') return `今日专题待正式更新`;
      return `今日专题状态待验证`;
    }
    function healthNumber(value, fallback = '未知') {
      return value === 0 || value ? value : fallback;
    }
    function getPublicScanBridgeState(info) {
      const latestScanUrl = info?.homepageBridge?.latestScanUrl || '';
      const publicScanBridge = Array.isArray(info?.links?.publicScanBridge) ? info.links.publicScanBridge : [];
      const matched = publicScanBridge.find(entry => entry?.url === latestScanUrl);
      if (!latestScanUrl) {
        return { status: 'pending-link-check', showLatestScan: false, note: '未配置最新扫描链接' };
      }
      if (matched?.ok === true) {
        return { status: 'pass', showLatestScan: true, note: '链接已校验' };
      }
      if (matched?.hardBroken || matched?.status === 404) {
        return { status: 'fail', showLatestScan: false, note: '最新扫描不可访问，改用公开镜像入口' };
      }
      if (matched) {
        return { status: 'pending-link-check', showLatestScan: true, note: '最新扫描链接待复核，已保留直达入口' };
      }
      return { status: 'pending-link-check', showLatestScan: true, note: '等待链接校验，已保留直达入口' };
    }
    async function fetchManifest(url, key) {
      try {
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
        statusManifests[key] = await resp.json();
      } catch (error) {
        statusManifestLoadFailed = true;
        statusManifestErrors.push(`${url}: ${error.message}`);
      }
    }
    async function loadStatusManifests() {
      statusManifests = { info: null, topics: null, knowledge: null, automation: null };
      statusManifestLoadFailed = false;
      statusManifestErrors = [];
      const manifestRequests = [
        fetchManifest('./data/info-feed-status.json', 'info'),
        fetchManifest('./data/knowledge-status.json', 'knowledge')
      ];
      if (ODIC_EDITION !== 'hr') {
        manifestRequests.push(
          fetchManifest('./data/topic-projects-status.json', 'topics'),
          fetchManifest('./data/automation-status.json', 'automation')
        );
      }
      await Promise.all(manifestRequests);
    }
    function renderStatusDashboard() {
      const container = document.getElementById('statusDashboard');
      if (!container) return;
      const info = statusManifests.info;
      const topics = statusManifests.topics;
      const knowledge = statusManifests.knowledge;
      const automation = statusManifests.automation;
      if (ODIC_EDITION === 'hr') {
        container.innerHTML = window.ODICApp.renderReaderStatus({
          info,
          knowledge,
          days: allDays,
          manifestLoadFailed: statusManifestLoadFailed
        });
        return;
      }
      const fallbackWarning = statusManifestLoadFailed
        ? `<div class="manifest-fallback-warning">状态源加载失败，以下为历史静态索引，不代表今日正式状态。${esc(statusManifestErrors.join('；'))}</div>`
        : '';
      const infoStatus = info?.qualityStatus || 'warn';
      const topicStatus = topics?.todayStatus || topics?.qualityStatus || 'warn';
      const knowledgeStatus = knowledge?.qualityStatus || 'warn';
      const publicStatus = overallPublicStatus(infoStatus, topicStatus, knowledgeStatus, automation?.qualityStatus);
      const publicScanState = getPublicScanBridgeState(info);
      const latestDate = info?.latestDate || allDays[0]?.date || '未知';

    function switchTab(tab) {
      tab = window.ODICApp.allowedTab(tab);
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      if (tab === 'levels') renderLevelsPage();
      if (tab === 'kb') renderKBPage();

    // ============================================================
    // Parser
    // ============================================================
    function parseDigest(markdown) {
      const lines = markdown.split('\n');
      let currentDay = null;
      let currentItem = null;
      const days = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.includes('<!--')) continue;
        const dayMatch = line.match(/^## (\d{4}-\d{2}-\d{2})\b/);
        if (dayMatch) {
          if (currentDay && currentDay.items.length > 0) days.push(currentDay);
          currentDay = { date: dayMatch[1], items: [] };
          currentItem = null;
          continue;
        }
        if (!currentDay) continue;
        const titleMatch = line.match(/^### \[([A-Za-z0-9-]+)\]\s+(.+)/);
        if (titleMatch) {
          currentItem = {
            id: titleMatch[1], title: titleMatch[2],
            summary: '', source: '', sourceUrl: '', platform: '',
            trust: '', infoType: '', channelType: '', conclusionConfidence: '',
            verificationQuestion: '', insight: '', tags: [], time: ''
          };
          currentDay.items.push(currentItem);
          continue;
        }
        if (!currentItem) continue;
        const summaryMatch = line.match(/^- \*\*事件摘要\*\*[：:]\s*(.+)/);
        if (summaryMatch) { currentItem.summary = summaryMatch[1]; continue; }
        const sourceMatch = line.match(/^- \*\*来源\*\*[：:]\s*(.+)/);
        if (sourceMatch) {
          const raw = sourceMatch[1].trim();
          const mdLinkMatch = raw.match(/^\[([^\]]*)\]\(([^)]+)\)$/);
          if (mdLinkMatch) {
            currentItem.source = mdLinkMatch[1];
            currentItem.sourceUrl = mdLinkMatch[2];
          } else {
            const parenMatch = raw.match(/^(.+?)[（(](.+?)[）)]/);
            if (parenMatch) {
              currentItem.source = parenMatch[1].trim();
              currentItem.sourceUrl = parenMatch[2].trim();
            } else {
              currentItem.source = raw;
            }
          }
          continue;
        }
        const platformMatch = line.match(/^- \*\*来源平台\*\*[：:]\s*(.+)/);
        if (platformMatch) { currentItem.platform = platformMatch[1].trim(); continue; }
        const trustMatch = line.match(/^- \*\*来源可信度\*\*[：:]\s*(.+)/);
        if (trustMatch) { currentItem.trust = trustMatch[1].trim(); continue; }
        const infoTypeMatch = line.match(/^- \*\*信息类型\*\*[：:]\s*(.+)/);
        if (infoTypeMatch) { currentItem.infoType = infoTypeMatch[1].trim(); continue; }
        const channelTypeMatch = line.match(/^- \*\*渠道类型\*\*[：:]\s*(.+)/);
        if (channelTypeMatch) { currentItem.channelType = channelTypeMatch[1].trim(); continue; }
        const confidenceMatch = line.match(/^- \*\*结论置信度\*\*[：:]\s*(.+)/);
        if (confidenceMatch) { currentItem.conclusionConfidence = confidenceMatch[1].trim(); continue; }
        const verificationMatch = line.match(/^- \*\*验证问题\*\*[：:]\s*(.+)/);
        if (verificationMatch) { currentItem.verificationQuestion = verificationMatch[1].trim(); continue; }
        const insightMatch = line.match(/^- \*\*OD启示\*\*[：:]\s*(.+)/);
        if (insightMatch) { currentItem.insight = insightMatch[1]; continue; }
        const tagMatch = line.match(/^- \*\*标签\*\*[：:]\s*(.+)/);
        if (tagMatch) {
          currentItem.tags = tagMatch[1].match(/#[\w\u4e00-\u9fff-]+/g) || [];
          currentItem.tags = currentItem.tags.map(t => t.replace('#', ''));
          continue;
        }
        const timeMatch = line.match(/^- \*\*抓取时间\*\*[：:]\s*(.+)/);
        if (timeMatch) { currentItem.time = timeMatch[1]; continue; }
      }
      if (currentDay && currentDay.items.length > 0) days.push(currentDay);
      return days;
    }

    // ============================================================
    // Load
    // ============================================================
    async function loadData() {
      await loadStatusManifests();
      try {
        const resp = await fetch('./digest.md');
        if (resp.ok) {
          const text = await resp.text();
          allDays = parseDigest(text);
        }
      } catch (e) { console.log('digest.md not loaded'); }

      // Try loading knowledge base catalog
      try {
        const resp = await fetch('./knowledge/catalog.json');
        if (resp.ok) {
          const data = await resp.json();
          kbReports = data.reports || [];
          kbSources = data.knowledgeSources || [];
          // Dynamically update source types and topic tags from catalog categories
          if (data.categories) {
            if (data.categories.sourceType) {
              for (const [key, info] of Object.entries(data.categories.sourceType)) {
                if (!KB_SOURCE_TYPES[key]) {
                  KB_SOURCE_TYPES[key] = { label: info.label, icon: info.icon, class: key };
                }
              }
            }
            if (data.categories.topic) {
              for (const [key, info] of Object.entries(data.categories.topic)) {
                if (!KB_TOPIC_TAGS[key]) {
                  KB_TOPIC_TAGS[key] = info.icon;
                }
              }
            }
          }
        }
      } catch (e) { console.log('kb catalog not loaded'); }

      updateBadges();
      renderStatusDashboard();
      renderInfoPage();
      if (ODIC_EDITION !== 'hr') renderLevelsPage();

      const params = new URLSearchParams(window.location.search);
      const sharedKBId = params.get('kb');
      if (sharedKBId) {
        switchTab('kb');
        setTimeout(() => openKBReader(sharedKBId), 0);
      }
    }

    function updateBadges() {
      const totalItems = allDays.reduce((s, d) => s + d.items.length, 0);
      const infoBadge = document.getElementById('infoBadge');
      const levelsBadge = document.getElementById('levelsBadge');
      const kbBadge = document.getElementById('kbBadge');
      if (infoBadge) infoBadge.textContent = totalItems;
      if (levelsBadge) levelsBadge.textContent = 4;
      if (kbBadge) kbBadge.textContent = kbReports.length;

      const totalDays = allDays.length;
      const totalSources = new Set();
      allDays.forEach(d => d.items.forEach(item => {
        totalSources.add(item.platform || item.source || '');
      }));
      const headerStats = document.getElementById('headerStats');
      if (headerStats) {
        headerStats.innerHTML =
          `<span>📅 <strong>${totalDays}</strong> 天</span>` +
          `<span>📄 <strong>${totalItems}</strong> 条</span>` +
          `<span>📡 <strong>${totalSources.size}</strong> 源</span>`;
      }
    }

    // ============================================================
    // Info Page Renderers
    // ============================================================
    function getAllTags() {
      const tagSet = new Set();
      allDays.forEach(d => d.items.forEach(item => item.tags.forEach(t => tagSet.add(t))));
      return Array.from(tagSet).sort();
    }
    function getAllPlatforms() {
      const srcMap = new Map();
      allDays.forEach(d => d.items.forEach(item => {
        const p = item.platform || item.source || '未知';
        srcMap.set(p, (srcMap.get(p) || 0) + 1);
      }));
      return Array.from(srcMap.entries()).sort((a, b) => b[1] - a[1]);
    }
    function getTrustStats() {
      const stats = { '⭐高': 0, '📰较高': 0, '💬参考': 0, '': 0 };
      allDays.forEach(d => d.items.forEach(item => {
        const t = item.trust || '';
        if (stats[t] !== undefined) stats[t]++;
        else stats['']++;
      }));
      return stats;
    }
    function renderTrustFilters() {
      const container = document.getElementById('trustFilters');
      const stats = getTrustStats();
      let html = '<span class="filter-label">可信度：</span>';
      html += `<span class="filter-tag ${!activeTrustFilter ? 'active' : ''}" onclick="setTrustFilter(null)">全部</span>`;
      for (const [key, info] of Object.entries(TRUST_LEVELS)) {
        const count = stats[key] || 0;
        if (count > 0) {
          html += `<span class="filter-tag ${info.class} ${activeTrustFilter === key ? 'active' : ''}" onclick="setTrustFilter('${key}')">${info.label} (${count})</span>`;
        }
      }
      container.innerHTML = html;
    }
    function renderSourceFilters() {
      const container = document.getElementById('sourceFilters');
      const platforms = getAllPlatforms();
      if (platforms.length === 0) { container.innerHTML = ''; return; }
      let html = '<span class="filter-label">来源：</span>';
      html += `<span class="filter-tag source-tag ${!activeSourceFilter ? 'active' : ''}" onclick="setSourceFilter(null)">全部</span>`;
      platforms.forEach(([name, count], index) => {
        const hidden = !sourceExpanded && index >= FILTER_LIMIT;
        html += `<span class="filter-tag source-tag ${activeSourceFilter === name ? 'active' : ''} ${hidden ? 'collapsed' : 'expanded'}" onclick="setSourceFilter('${name.replace(/'/g, "\\'")}')">${esc(name)} (${count})</span>`;
      });
      // 如果超过限制，添加展开/收起按钮
      if (platforms.length > FILTER_LIMIT) {
        html += `<button class="filter-more" onclick="toggleSourceExpand()">${sourceExpanded ? '收起 ↑' : '更多 ↓'}</button>`;
      }
      container.innerHTML = html;
    }
    function renderTagFilters() {
      const container = document.getElementById('tagFilters');
      const tags = getAllTags();
      if (tags.length === 0) { container.innerHTML = ''; return; }
      let html = '<span class="filter-label">标签：</span>';
      html += `<span class="filter-tag ${!activeTagFilter ? 'active' : ''}" onclick="setTagFilter(null)">全部</span>`;
      tags.forEach((tag, index) => {
        const hidden = !tagExpanded && index >= FILTER_LIMIT;
        html += `<span class="filter-tag ${activeTagFilter === tag ? 'active' : ''} ${hidden ? 'collapsed' : 'expanded'}" onclick="setTagFilter('${tag}')">#${esc(tag)}</span>`;
      });

      if (tags.length > FILTER_LIMIT) {
        html += `<button class="filter-more" onclick="toggleTagExpand()">${tagExpanded ? '收起 ↑' : '更多 ↓'}</button>`;
      }
      container.innerHTML = html;
    }
    function toggleSourceExpand() { sourceExpanded = !sourceExpanded; renderSourceFilters(); }
    function toggleTagExpand() { tagExpanded = !tagExpanded; renderTagFilters(); }
    let coverageExpanded = false;
    function renderCoverage() {
      const container = document.getElementById('coverage');
      const platforms = getAllPlatforms();
      if (platforms.length === 0) { container.innerHTML = ''; return; }
      let html = `<div class="coverage-header" onclick="toggleCoverage()" style="cursor:pointer;display:flex;align-items:center;gap:6px;"><span class="coverage-title">📊 来源覆盖（${platforms.length} 个平台）</span><span style="color:var(--text2);font-size:12px;">${coverageExpanded ? '收起 ↑' : '展开 ↓'}</span></div>`;
      if (coverageExpanded) {
        html += '<div class="coverage-bar">';
        for (const [cat, expectedPlatforms] of Object.entries(PLATFORM_CATEGORIES)) {
          for (const ep of expectedPlatforms) {
            const found = platforms.find(([name]) => name.includes(ep));
            html += `<span class="coverage-item ${found ? 'active' : ''}">${ep}${found ? ` <span class="coverage-count">(${found[1]})</span>` : ''}</span>`;

        html += '</div>';
      }
      container.innerHTML = html;

    function toggleCoverage() { coverageExpanded = !coverageExpanded; renderCoverage(); }

          if (activeTrustFilter && item.trust !== activeTrustFilter) return false;
          if (activeSourceFilter) {
            const p = item.platform || item.source || '';
            if (p !== activeSourceFilter && !p.includes(activeSourceFilter) && !activeSourceFilter.includes(p)) return false;
          }
          if (activeTagFilter && !item.tags.includes(activeTagFilter)) return false;
          if (query) {
            const haystack = [item.title, item.summary, item.source, item.platform, item.insight, ...item.tags].join(' ').toLowerCase();
            return haystack.includes(query);
          }
          return true;
        });
        return { ...day, items: filteredItems };

    function renderKBPage() {
      const container = document.getElementById('kbContent');
      const sourceTypes = Object.entries(KB_SOURCE_TYPES);
      const topicTags = Object.entries(KB_TOPIC_TAGS);

      // Count stats
      const sourceCounts = {};
      kbReports.forEach(r => {
        sourceCounts[r.sourceType] = (sourceCounts[r.sourceType] || 0) + 1;
      });
      const topicCounts = {};
      kbReports.forEach(r => {
        (r.topics || []).forEach(t => {
          topicCounts[t] = (topicCounts[t] || 0) + 1;
        });
      });

      let html = '';

      html += `<div class="kb-method-hero">`;
      html += `<div class="kb-method-kicker">🧠 Karpathy LLM Wiki 模式</div>`;
      html += `<h2>知识库不是文件堆，是可持续维护的 OD Wiki</h2>`;
      html += `<p>这里把本地 Obsidian、知音楼学习资料、外部报告和每日研究产出统一成 Raw Sources / Wiki / Schema 三层：原始资料保真，LLM 负责编译和交叉引用，页面只呈现可读、可追溯、能继续迭代的知识资产。</p>`;
      html += `<div class="kb-method-grid">`;
      html += `<div class="kb-method-chip"><strong>Raw Sources</strong><span>原始资料、网页、PDF、Obsidian 笔记，只读保真。</span></div>`;
      html += `<div class="kb-method-chip"><strong>Wiki</strong><span>摘要、概念、案例、对比和方法论，由 LLM 持续维护。</span></div>`;
      html += `<div class="kb-method-chip"><strong>Schema / Log</strong><span>用规则和日志约束导入、更新、检索与健康检查。</span></div>`;
      html += `</div></div>`;

      if (kbSources.length > 0) {
        html += `<div class="kb-source-board">`;
        kbSources.forEach(source => {
          const statusClass = source.id === 'obsidian-vault' ? 'ready' : (source.id === 'karpathy-llm-wiki' ? 'method' : 'pending');
          html += `<div class="kb-source-card ${statusClass}">`;
          html += `<div class="kb-source-top"><div class="kb-source-title">${esc(source.title)}</div><span class="kb-source-status">${esc(source.status)}</span></div>`;
          html += `<div class="kb-source-desc">${esc(source.description)}</div>`;
          html += `<div class="kb-source-actions">`;
          if (source.summaryFile) html += `<a class="levels-btn" href="${esc(source.summaryFile)}" target="_blank">查看说明</a>`;
          if (source.url) html += `<a class="levels-btn" href="${esc(source.url)}" target="_blank">打开来源</a>`;
          html += `</div></div>`;
        });
        html += `</div>`;
      }

      // URL Archive + Upload banner
      html += `<div class="kb-archive-banner">`;
      html += `<div class="kb-archive-banner-title">🔗 添加网页存档</div>`;
      html += `<form class="kb-archive-form" id="kbArchiveForm" onsubmit="handleKBArchive(event)">`;
      html += `<input type="url" class="kb-archive-input" id="kbArchiveUrl" placeholder="粘贴任意网页链接，Javis 将自动抓取存档..." required />`;
      html += `<button type="submit" class="kb-archive-btn" id="kbArchiveBtn">📥 存档</button>`;
      html += `</form>`;
      html += `<div class="kb-archive-note">💡 也可以直接发链接给 Javis 处理 · 支持公众号文章、网页报道、在线报告等</div>`;
      html += `<div id="kbArchiveResult"></div>`;
      html += `</div>`;

      // Upload tip
      html += `<div style="background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border);">`;
      html += `<div style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px;">📄 上传 PDF/文档</div>`;
      html += `<div style="font-size:12px; color:var(--text2); line-height:1.6;">将文件或文件路径发给 Javis，自动解析内容、分类、生成摘要并纳入知识库。</div>`;
      html += `</div>`;

      // Filters
      html += `<div class="kb-filters">`;
      html += `<span class="kb-filter-label">来源：</span>`;
      html += `<span class="kb-filter-tag ${!kbSourceTypeFilter ? 'active' : ''}" onclick="setKBSourceFilter(null)">全部 (${kbReports.length})</span>`;
      sourceTypes.forEach(([key, info]) => {
        const count = sourceCounts[key] || 0;
        if (count > 0) {
          html += `<span class="kb-filter-tag ${kbSourceTypeFilter === key ? 'active' : ''}" onclick="setKBSourceFilter('${key}')">${info.icon} ${info.label} (${count})</span>`;
        }
      });
      html += `</div>`;
      html += `<div class="kb-filters">`;
      html += `<span class="kb-filter-label">主题：</span>`;
      html += `<span class="kb-filter-tag ${!kbTopicFilter ? 'active' : ''}" onclick="setKBTopicFilter(null)">全部</span>`;
      topicTags.forEach(([tag, icon]) => {
        const count = topicCounts[tag] || 0;
        if (count > 0) {
          html += `<span class="kb-filter-tag ${kbTopicFilter === tag ? 'active' : ''}" onclick="setKBTopicFilter('${tag}')">${icon} ${tag} (${count})</span>`;
        }
      });
      html += `</div>`;

      // Search
      html += `<div class="search-wrap" style="margin-bottom: 16px;">`;
      html += `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
      html += `<input type="text" class="kb-search-box" id="kbSearchBox" placeholder="搜索报告标题、描述、主题..." oninput="renderKBCards()" />`;
      html += `</div>`;

      // Stats
      const filteredCount = getFilteredKBReports().length;
      html += `<div class="kb-stats">共 <strong>${kbReports.length}</strong> 份报告${filteredCount !== kbReports.length ? ` · 当前显示 <strong>${filteredCount}</strong> 份` : ''}</div>`;

      // Cards
      html += `<div id="kbCards"></div>`;
      container.innerHTML = html;
      renderKBCards();
    }

    function getFilteredKBReports() {
      const query = document.getElementById('kbSearchBox') ? document.getElementById('kbSearchBox').value.toLowerCase().trim() : '';
      return kbReports.filter(r => {
        if (kbSourceTypeFilter && r.sourceType !== kbSourceTypeFilter) return false;
        if (kbTopicFilter && !(r.topics || []).includes(kbTopicFilter)) return false;
        if (query) {
          const haystack = [r.title, r.description, r.author, r.publisher, ...(r.topics || [])].join(' ').toLowerCase();
          return haystack.includes(query);
        }
        return true;
      });
    }

    function renderKBCards() {
      const cardsContainer = document.getElementById('kbCards');
      if (!cardsContainer) return;
      const filtered = getFilteredKBReports();

      // Update stats
      const statsEl = cardsContainer.previousElementSibling;
      if (statsEl) {
        const filteredCount = filtered.length;
        statsEl.innerHTML = `共 <strong>${kbReports.length}</strong> 份报告${filteredCount !== kbReports.length ? ` · 当前显示 <strong>${filteredCount}</strong> 份` : ''}`;
      }

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `<div class="kb-empty"><div class="kb-empty-icon">📚</div><h3>${kbReports.length === 0 ? '知识库为空' : '未找到匹配报告'}</h3><p>${kbReports.length === 0 ? '将报告文件发给 Javis，即可自动解析分类并纳入知识库。' : '试试调整搜索条件或筛选器'}</p></div>`;
        return;
      }

      let html = '<div class="kb-grid">';
      filtered.forEach(report => {
        const typeInfo = KB_SOURCE_TYPES[report.sourceType] || KB_SOURCE_TYPES.industry;
        const topicIcons = (report.topics || []).map(t => {
          const icon = KB_TOPIC_TAGS[t] || '📌';
          return `<span class="kb-card-tag">${icon} ${t}</span>`;
        }).join('');

        html += `<div class="kb-card" onclick="openKBReader('${esc(report.id)}')">`;
        html += `<div class="kb-card-header">`;
        html += `<div class="kb-card-icon ${typeInfo.class}">${typeInfo.icon}</div>`;
        html += `<span class="kb-card-type ${typeInfo.class}">${typeInfo.label}</span>`;
        html += `</div>`;
        html += `<div class="kb-card-title">${esc(report.title)}</div>`;
        html += `<div class="kb-card-desc">${esc(report.description)}</div>`;
        html += `<div class="kb-card-meta">`;
        html += topicIcons;
        if (report.date) html += `<span class="kb-card-date">${esc(report.date)}</span>`;
        html += `</div>`;
        if (report.author) {
          html += `<div class="kb-card-file">✍️ ${esc(report.author)}${report.publisher ? ' · ' + esc(report.publisher) : ''}</div>`;
        }
        if (report.fileName) {
          html += `<div class="kb-card-file">📎 ${esc(report.fileName)}${report.fileSize ? ' (' + esc(report.fileSize) + ')' : ''}</div>`;
        }
        html += `<div class="kb-card-actions">`;
        html += `<a class="kb-mini-btn primary" href="${esc(getKBShareUrl(report.id))}" target="_blank" onclick="event.stopPropagation()">独立阅读</a>`;
        html += `<button class="kb-mini-btn" onclick="copyKBShareLink('${esc(report.id)}', event)">复制链接</button>`;
        if (report.summaryFile) {
          html += `<a class="kb-mini-btn" href="${esc(report.summaryFile)}" target="_blank" onclick="event.stopPropagation()">Markdown</a>`;
        }
        html += `</div>`;
        html += `</div>`;
      });
      html += '</div>';
      cardsContainer.innerHTML = html;
    }

    function setKBSourceFilter(type) {
      kbSourceTypeFilter = type;
      renderKBPage();
    }
    function setKBTopicFilter(topic) {
      kbTopicFilter = topic;
      renderKBPage();
    }

    // ============================================================
    // KB Reader
    // ============================================================
    function openKBReader(reportId) {
      const report = kbReports.find(r => r.id === reportId);
      if (!report) return;

      const typeInfo = KB_SOURCE_TYPES[report.sourceType] || KB_SOURCE_TYPES.industry;

      // Fill header
      document.getElementById('kbReaderType').textContent = typeInfo.label;
      document.getElementById('kbReaderType').className = 'kb-reader-type ' + typeInfo.class;
      document.getElementById('kbReaderTitle').textContent = report.title;
      const metaParts = [];
      if (report.author) metaParts.push(report.author);
      if (report.publisher) metaParts.push(report.publisher);
      if (report.date) metaParts.push(report.date);
      document.getElementById('kbReaderMeta').textContent = metaParts.join(' · ');

      // Actions
      const actionsEl = document.getElementById('kbReaderActions');
      let actionsHtml = '';
      actionsHtml += `<a href="${esc(getKBShareUrl(report.id))}" class="kb-mini-btn primary" target="_blank">独立阅读页</a>`;
      actionsHtml += `<button class="kb-mini-btn" onclick="copyKBShareLink('${esc(report.id)}', event)">复制分享链接</button>`;
      if (report.pdfFile) {
        actionsHtml += `<a href="${esc(report.pdfFile)}" class="btn-primary" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;" target="_blank">📄 下载原文 PDF</a>`;
      }
      if (report.originalUrl) {
        actionsHtml += `<a href="${esc(report.originalUrl)}" class="btn-secondary" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;" target="_blank">🔗 阅读原文</a>`;
      }
      actionsEl.innerHTML = actionsHtml;

      // Topics
      const topicsEl = document.getElementById('kbReaderTopics');
      topicsEl.innerHTML = (report.topics || []).map(t => `<span class="kb-reader-topic-tag">${KB_TOPIC_TAGS[t] || '📌'} ${esc(t)}</span>`).join('');

      // Content (load summary)
      const contentEl = document.getElementById('kbReaderContent');
      contentEl.innerHTML = '<div class="kb-reader-loading">⏳ 加载摘要内容中...</div>';

      // Load summary markdown if available
      if (report.summaryFile) {
        fetch(report.summaryFile)
          .then(r => r.text())
          .then(md => { contentEl.innerHTML = mdToHtml(md); })
          .catch(() => {
            contentEl.innerHTML = `<p style="color:var(--text2);font-size:13px;">📋 ${esc(report.description || '暂无摘要内容')}</p>`;
          });
      } else {
        contentEl.innerHTML = `<p style="color:var(--text2);font-size:13px;">📋 ${esc(report.description || '暂无摘要内容')}</p>`;
      }

      // Open overlay
      document.getElementById('kbReaderOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeKBReader() {
      document.getElementById('kbReaderOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function mdToHtml(md) {
      if (!md) return '';
      md = md.replace(/(^\|.+\|\n^\|[\s:\-|]+\|\n(?:^\|.+\|\n?)+)/gm, tableBlock => {
        const rows = tableBlock.trim().split('\n').filter(line => !/^\|[\s:\-|]+\|$/.test(line.trim()));
        if (rows.length < 2) return tableBlock;
        const cells = line => line.trim().replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
        const header = cells(rows[0]);
        const body = rows.slice(1).map(row => cells(row));
        return `<table><thead><tr>${header.map(cell => `<th>${cell}</th>`).join('')}</tr></thead><tbody>${body.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      });
      let html = md
        // Remove the title comment block at the top
        .replace(/^> \*\*原标题\*\*.*?\n> \*\*发布日期\*\*.*?\n\n---\n\n/, '')
        // H1
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        // H2
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        // H3
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        // HR
        .replace(/^---$/gm, '<hr>')
        // Blockquote (single line)
        .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
        // Bold
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        // Italic
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Unordered list items
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        // Ordered list items
        .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
        // Wrap consecutive <li> in <ul>
        .replace(/(<li>.*<\/li>\n?)+/g, match => '<ul>' + match + '</ul>')
        // Paragraphs: wrap non-tag lines
        .split('\n\n')
        .map(block => {
          block = block.trim();
          if (!block) return '';
          if (/^<(h[1-3]|ul|ol|blockquote|hr|div|table)/.test(block)) return block;
          if (block.startsWith('<ul>') || block.startsWith('<ol>')) return block;
          return `<p>${block}</p>`;
        })
        .join('\n');
      return html;
    }

    // ============================================================
    // KB URL Archive
    // ============================================================
    function handleKBArchive(event) {
      event.preventDefault();
      const url = document.getElementById('kbArchiveUrl').value.trim();
      if (!url) return;

      const btn = document.getElementById('kbArchiveBtn');
      const resultEl = document.getElementById('kbArchiveResult');
      btn.disabled = true;
      btn.textContent = '⏳ 处理中...';
      resultEl.innerHTML = '';

      // Since GitHub Pages is static, we show instructions for Javis to process
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '📥 存档';
        resultEl.innerHTML = `
          <div class="kb-archive-result success">
            ✅ 链接已记录：<strong>${esc(url)}</strong><br>
            请将此链接发送给 Javis，我将自动抓取内容、解析归档，纳入知识库。
          </div>
        `;
        document.getElementById('kbArchiveUrl').value = '';
      }, 600);
    }

    // ============================================================
    // Init
    // ============================================================
    document.getElementById('searchBox').addEventListener('input', renderInfoList);
    loadData();
  </script>
