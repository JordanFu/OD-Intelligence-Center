<!DOCTYPE html>
<html lang="zh-CN" data-edition="hr">
<head>
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向 HR 伙伴的每日组织情报与人力资源知识库。">
  <title>OD 情报中心｜HR 分享版</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f1117;
      color: #e1e4ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    .loading {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid #2e3348;
      border-radius: 16px;
      background: #1a1d27;
      text-align: center;
    }
    .loading strong { display: block; font-size: 18px; }
    .loading p { margin: 10px 0 0; color: #8b91a8; line-height: 1.7; }
    .loading button {
      margin-top: 16px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      background: #6c8cff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="loading" id="hrLoading" aria-live="polite">
    <strong>正在打开 OD 情报中心</strong>
    <p>正在读取每日组织情报与 HR 知识库。</p>
  </main>
  <noscript>请启用 JavaScript 后查看每日组织情报与 HR 知识库。</noscript>
  <script src="assets/hr-entry.js"></script>
</body>
</html>
