name: AI Org Reports Fallback

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Override report date in YYYY-MM-DD, Asia/Shanghai'
        required: false
        type: string
  schedule:
    # 18:20 Asia/Shanghai daily. GitHub cron uses UTC.
    - cron: '20 10 * * *'
    # Same-day guardrail at 21:30 Asia/Shanghai in case the local deep-research run missed 18:00.
    - cron: '30 13 * * *'
    # Next-morning backfill at 09:30 Asia/Shanghai; covers weekends, sleep, and local network failures.
    - cron: '30 1 * * *'
    # Extra weekly guardrail every Monday 18:45 Asia/Shanghai.
    - cron: '45 10 * * 1'

permissions:
  contents: write

concurrency:
  group: ai-org-reports-fallback
  cancel-in-progress: false

jobs:
  ensure-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure recent daily and weekly reports
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          ENSURE_DAYS: 4
          TZ: Asia/Shanghai
        run: node scripts/ensure-recent-ai-org-reports.js

      - name: Run report quality gate
        continue-on-error: true
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          TZ: Asia/Shanghai
        run: node scripts/quality-gate-ai-org-reports.js

      - name: Audit report coverage
        continue-on-error: true
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          AUDIT_LOOKBACK_DAYS: 14
          TZ: Asia/Shanghai
        run: node scripts/audit-ai-org-report-coverage.js

      - name: Generate topic project status
        env:
          TZ: Asia/Shanghai
        run: node scripts/generate-topic-project-status.js

      - name: Audit information library
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: node scripts/audit-info-library.js

      - name: Ingest PDF references into knowledge base
        env:
          TZ: Asia/Shanghai
        run: node scripts/ingest-pdf-references.js

      - name: Update rolling baselines
        env:
          TZ: Asia/Shanghai
        run: node scripts/update-ai-org-baselines.js

      - name: Ensure report sharing
        env:
          TZ: Asia/Shanghai
        run: node scripts/enhance-report-sharing.js

      - name: Lint knowledge base
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: node scripts/lint-knowledge-base.js

      - name: Check public links
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: node scripts/check-public-links.js

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets data specials daily daily-report knowledge pdfs operations report-viewer.html knowledge-viewer.html .github/workflows/ai-org-reports-fallback.yml scripts/ensure-ai-org-reports.js scripts/ensure-recent-ai-org-reports.js scripts/ingest-pdf-references.js scripts/update-ai-org-baselines.js scripts/render-markdown-page.js scripts/render-special-html.js scripts/enhance-report-sharing.js scripts/quality-gate-ai-org-reports.js scripts/audit-ai-org-report-coverage.js scripts/audit-info-library.js scripts/generate-topic-project-status.js scripts/lint-knowledge-base.js scripts/check-public-links.js ':(exclude)**/.DS_Store' ':(exclude)**/*.env' ':(exclude)**/*.tmp' ':(exclude)**/*.log' ':(exclude)**/*secret*' ':(exclude)**/*private*'
          git commit -m "auto-fallback: ensure AI org reports"
          git push
